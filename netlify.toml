# Netlify config: static site, no build step.
[build]
  publish = "."

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived caching for static assets.
# If you edit css/js/images, rename the file or add ?v=2 in index.html to bust caches.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Local dev tooling (.claude/launch.json + serve.ps1) lives in the publish folder; never serve it.
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# Internal docs and repo files: keep them off the public site
[[redirects]]
  from = "/MAINTENANCE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
